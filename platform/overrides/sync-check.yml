name: sync-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (all python scripts)
        run: |
          python -m py_compile scripts/generate_roster_tables.py
          python -m py_compile scripts/profile_drift.py
          python -m py_compile skills/coopanion-forge/scripts/check_contract_approval.py
          python -m py_compile skills/coopanion-forge/scripts/security_audit.py
          python -m py_compile tools/sync_kernel.py
          python -m py_compile tools/install_hosts.py
      - name: Roster generator self-test
        run: python scripts/generate_roster_tables.py --self-test
      - name: Roster tables and head-counts in sync
        run: python scripts/generate_roster_tables.py --check
      - name: Contract gate self-test
        run: python skills/coopanion-forge/scripts/check_contract_approval.py --self-test
      - name: Security audit self-test
        run: python skills/coopanion-forge/scripts/security_audit.py --self-test
      - name: Drift probe self-test
        run: python scripts/profile_drift.py --self-test
      - name: Kernel sync ledger self-test
        run: python tools/sync_kernel.py --self-test
      - name: 模板检查器自检
        run: python tools/check_templates.py --self-test
      - name: 模板与来源清单一致（模板被改过就退 1）
        run: python tools/check_templates.py --check
      - name: Delta ledger matches its generator
        # platform/deltas.json 的唯一来源是 tools/gen_deltas.py。手改 JSON 而不改生成器，
        # 下一次重生成会静默抹掉那条改写（LICENSE 那条就是这么漏的，2026-11-16 才发现）。
        run: python tools/gen_deltas.py --check
      - name: Host installer self-test
        run: python tools/install_hosts.py --self-test
      - name: 对本仓库跑一次真实安全扫描
        env:
          AUDIT_ALLOW: skills/coopanion-forge/scripts/security_audit.py,scripts/profile_drift.py,tools/sync_kernel.py,platform/deltas.json
        run: python skills/coopanion-forge/scripts/security_audit.py . --allow "$AUDIT_ALLOW"
      - name: '文档面密钥门禁（阻塞：只判 SEC-2；SEC-1/3/4 的文档命中只记日志）'
        # 内核工单 W14 的本仓版。上面几步都不带 --include-docs，.md 一个字都不读：
        # 真 token 混进 profile 或 AUDIT 也能全绿。这一步开文档面，只对一票否决那类设阻塞。
        # 不能吃扫描器退出码：本仓文档的 SEC-1/3/4 命中实测 27 / 5 / 38 处，全是散文与
        # 上游 URL 的说明文字，整份文档扫描本身永远非 0，拿它当门禁等于把 CI 永久钉红。
        # JSON 落 $RUNNER_TEMP，不落在仓里，免得下一步 glob('**/*.json') 把它读进去。
        env:
          AUDIT_ALLOW: skills/coopanion-forge/scripts/security_audit.py,scripts/profile_drift.py,tools/sync_kernel.py,platform/deltas.json
        run: |
          rc=0
          python skills/coopanion-forge/scripts/security_audit.py . --allow "$AUDIT_ALLOW" --include-docs --json > "$RUNNER_TEMP/audit-docs.json" || rc=$?
          echo "扫描器自身退出码 $rc（文档面本来就非 0，本步不看它）"
          python - "$RUNNER_TEMP/audit-docs.json" <<'PY'
          import json, sys
          DOCS = (".md", ".markdown", ".txt", ".rst", ".llm")
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          sec2 = d["findings"]["SEC-2"]
          docs2 = [h for h in sec2 if h["file"].lower().endswith(DOCS)]
          print("counts:", d["counts"], "| SEC-2 合计 %d，其中文档 %d" % (len(sec2), len(docs2)))
          for c in ("SEC-1", "SEC-3", "SEC-4"):
              inc = [h for h in d["findings"][c] if h["file"].lower().endswith(DOCS)]
              if inc:
                  print("INFO %s 文档命中 %d 处（不计分、不阻塞）" % (c, len(inc)))
                  for h in inc[:5]:
                      print("   %s:%d [%s]" % (h["file"], h["line"], h.get("note", "")))
          if sec2:
              print("BLOCK SEC-2：文档或代码里有明文密钥形状，一票否决")
              for h in sec2:
                  print("   %s:%d [%s]" % (h["file"], h["line"], h.get("note", "")))
              sys.exit(1)
          print("OK SEC-2 = 0（教学示例走点位声明，不走整份 --allow）")
          PY
      - name: '审计两个严格档旗标（盲区 / 占位符，阻塞）'
        # 2026-11-17 起改成阻塞步（仓主定「warning 当 error」）。两条都不再带 || true。
        # 本机实测两步都退 0，所以这不是把已知红灯放进来，是把「以后悄悄多出盲区」这条路堵掉。
        env:
          AUDIT_ALLOW: skills/coopanion-forge/scripts/security_audit.py,scripts/profile_drift.py,tools/sync_kernel.py,platform/deltas.json
        run: |
          python skills/coopanion-forge/scripts/security_audit.py . --allow "$AUDIT_ALLOW" --fail-unclear
          python skills/coopanion-forge/scripts/security_audit.py . --allow "$AUDIT_ALLOW" --strict-placeholder
      - name: 'profile 锚点漂移探针（阻塞）'
        # 同上改成阻塞。退 1 = 真有锚点漂了。退 2 = 上游取不到（限流、断网、仓改名），
        # 现在也算失败：拿不到证据不许当「没问题」放行。要放宽就改回 continue-on-error，
        # 但那等于把假绿重新请回来，先跟仓主确认。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/profile_drift.py --strict

      - name: '模板类型检查：装依赖（装不上时下一步只做语法兜底，并大声宣布）'
        # 目录用 glob 发现，不写死 world provider bot：写死三值时新增第四类模板目录带坏文件
        # 整条流水线退 0（外部审 41 号实测 P2_EXIT=0）。门禁只拦已知面就是假绿。
        id: tpl-install
        continue-on-error: true
        timeout-minutes: 10
        run: |
          corepack enable
          rc=0
          for pkg in templates/*/package.json; do
            d=$(dirname "$pkg")
            ( cd "$d" && pnpm install ) || { echo "install failed in $d"; rc=1; }  # forge-declared: SEC-4 理由=CI 装已发布的 cortico 与 typescript 做类型检查，不在产品运行路径 出处=AUDIT.md#sec-declared 复审=2026-12-15
          done
          exit "$rc"
      - name: '模板类型检查：真 tsc（依赖装上就必须全绿，不许降级）'
        # 能力边界三条，别把这一步当成全平台体检：
        #   1 只查各模板 tsconfig include 里的文件。vitest.config.ts 在 include 之外，
        #     41 号实测往里注类型错，tsc 退 0。
        #   2 describe.json 与 package.json 的 cortico.api 是否对齐不归本步，那是 check:extension 的活。
        #   3 装的是哪个 cortico 版本打印进 summary：模板钉 ^0.2.16，^ 会吃掉未来的 0.2.x。
        if: steps.tpl-install.outcome == 'success'
        timeout-minutes: 10
        run: |
          rc=0
          for pkg in templates/*/package.json; do
            d=$(dirname "$pkg")
            if ( cd "$d" && pnpm exec tsc --noEmit ); then
              { echo "### $d"; ( cd "$d" && pnpm ls cortico ); } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "TYPECHECK_MODE=full FAILED=$d" >> "$GITHUB_STEP_SUMMARY"
              rc=1
            fi
          done
          if [ "$rc" -eq 0 ]; then echo "TYPECHECK_MODE=full pass" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: '模板类型检查：降级兜底（仅装依赖失败时；默认仍阻断）'
        # node --check 只查语法：41 号实测带类型错的 16 个文件全绿（PIPE_RC=0），
        # 而且红绿会被最近一个 package.json 的 type 字段拨动。它只准当语法兜底卖。
        # 「装不动」永远不许被静默当成通过：默认退 1，放行只认维护者显式设的
        # repo variable ALLOW_SYNTAX_ONLY=1（治理口径见 AUDIT.md，W14 待拍板）。
        if: steps.tpl-install.outcome == 'failure'
        timeout-minutes: 10
        run: |
          echo "::error::cortico 或依赖装不上，真 tsc 没跑成。本轮只做语法级检查，不是类型检查。"
          echo "## TYPECHECK_MODE=syntax-only（未做类型检查）" >> "$GITHUB_STEP_SUMMARY"
          rc=0
          find templates -name '*.ts' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check || rc=1
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ "${{ vars.ALLOW_SYNTAX_ONLY }}" != "1" ]; then
            echo "兜底模式默认阻断；要放行需维护者设 ALLOW_SYNTAX_ONLY=1，并在 AUDIT.md 记一次复审期"
            exit 1
          fi
      - name: JSON artifacts parse
        # 对象是本仓产物，不是依赖树：模板类型检查步会装依赖，node_modules 落在工作区里，
        # 递归 glob 不排除的话就在替第三方包查 JSON（2026-11-17 CI 实测被顶红一次）。
        # tsconfig.json 属 JSONC：TypeScript 自己就按带注释的 JSON 读它，三份模板那几份是
        # 逐字搬来的上游件（check_templates 锁哈希），不许为迁就本步去改它们。
        # 失败时逐个打印路径与异常：前两次红只给一句「line 2 column 3」，没说文件。
        # 路径先归一化分隔符，同一条判据在 Linux 与 Windows 上结论必须一致。
        run: |
          python - <<'PY'
          import fnmatch, glob, json, os, sys
          SKIP_DIR = ('.git/', 'dist/', 'build/')
          JSONC = ('tsconfig.json', 'tsconfig.*.json', 'jsconfig.json')
          def keep(p):
              q = p.replace(chr(92), '/')
              if '/node_modules/' in '/' + q:
                  return False
              if q.startswith(SKIP_DIR):
                  return False
              return not any(fnmatch.fnmatch(os.path.basename(q), g) for g in JSONC)
          paths = [p for p in glob.glob('**/*.json', recursive=True) + glob.glob('.claude-plugin/*.json')
                   if keep(p)]
          bad = []
          for p in paths:
              try:
                  json.load(open(p, encoding='utf-8-sig'))
              except Exception as e:
                  bad.append('%s: %s' % (p, e))
          if bad:
              print('JSON 产物解析失败 %d 处：' % len(bad))
              for line in bad:
                  print('  ' + line)
              sys.exit(1)
          print('JSON 产物 %d 个全部可解析（JSONC 与 vendored 目录不参与）' % len(paths))
          PY